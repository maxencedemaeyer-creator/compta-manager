<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="faisceau" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="image"><rect x="128" y="124" width="256" height="184" rx="18"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#fond)"/>
  <rect width="512" height="512" rx="116" fill="url(#lueur)"/>
  <g transform="translate(0.0 0.0) scale(1.0)">
    <!-- faisceau du projecteur -->
    <path d="M226 410 L132 300 L380 300 L286 410 Z" fill="url(#faisceau)"/>
    <!-- écran / photo projetée -->
    <rect x="112" y="108" width="288" height="216" rx="28" fill="#ffffff"/>
    <g clip-path="url(#image)">
      <rect x="128" y="124" width="256" height="184" fill="url(#ciel)"/>
      <circle cx="322" cy="180" r="26" fill="#fbbf24"/>
      <path d="M128 308 L208 214 L262 274 L298 238 L384 308 Z" fill="#7c3aed"/>
      <path d="M128 308 L208 214 L236 247 L196 308 Z" fill="#6d28d9"/>
    </g>
    <!-- projecteur (lentille) -->
    <circle cx="256" cy="414" r="34" fill="#ffffff"/>
    <circle cx="256" cy="414" r="18" fill="#a21caf"/>
    <circle cx="249" cy="407" r="6" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>