<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="fond" cx="0.5" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#14233a"/>
      <stop offset="0.55" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="halo-vert" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CFF6B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7CFF6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B57BFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#B57BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9FFB8"/>
      <stop offset="0.25" stop-color="#7CFF6B"/>
      <stop offset="1" stop-color="#1FAE4A"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="hex" width="42" height="72.7" patternUnits="userSpaceOnUse">
      <path d="M21 0 L42 12.1 L42 36.4 L21 48.5 L0 36.4 L0 12.1 Z M21 48.5 L21 72.7" fill="none" stroke="#7CFF6B" stroke-width="1.6"/>
    </pattern>
    <clipPath id="fiole">
      <path d="M224 118 L224 226 L140 380 Q126 410 158 412 L354 412 Q386 410 372 380 L288 226 L288 118 Z"/>
    </clipPath>
    <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="lueur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#fond)"/>
  <rect width="512" height="512" fill="url(#hex)" opacity="0.09"/>

  <!-- lueurs -->
  <circle cx="256" cy="360" r="200" fill="url(#halo-vert)"/>
  <circle cx="300" cy="70" r="150" fill="url(#halo-violet)"/>

  <!-- fumée violette qui sort du col -->
  <g filter="url(#flou)" opacity="0.85">
    <circle cx="246" cy="84" r="30" fill="#B57BFF"/>
    <circle cx="288" cy="58" r="36" fill="#9A5BFF"/>
    <circle cx="330" cy="40" r="26" fill="#D3B0FF"/>
  </g>

  <!-- liquide -->
  <g clip-path="url(#fiole)">
    <path d="M100 302 Q150 288 200 300 T300 300 T412 298 L412 430 L100 430 Z" fill="url(#liquide)"/>
    <path d="M100 302 Q150 288 200 300 T300 300 T412 298" fill="none" stroke="#E8FFE0" stroke-width="5" opacity="0.8"/>
    <!-- bulles -->
    <circle cx="214" cy="372" r="11" fill="#E8FFE0" opacity="0.75"/>
    <circle cx="276" cy="346" r="8" fill="#E8FFE0" opacity="0.7"/>
    <circle cx="312" cy="384" r="14" fill="#E8FFE0" opacity="0.55"/>
    <circle cx="246" cy="330" r="5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="100" y="100" width="320" height="330" fill="url(#verre)"/>
  </g>
  <!-- bulles qui s'échappent -->
  <circle cx="252" cy="248" r="7" fill="#C9FFB8" opacity="0.85"/>
  <circle cx="262" cy="196" r="5" fill="#C9FFB8" opacity="0.7"/>
  <circle cx="248" cy="152" r="4" fill="#C9FFB8" opacity="0.55"/>

  <!-- verre de la fiole -->
  <g filter="url(#lueur)">
    <path d="M224 118 L224 226 L140 380 Q126 410 158 412 L354 412 Q386 410 372 380 L288 226 L288 118" fill="none" stroke="#EAF2FF" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="206" y="100" width="100" height="22" rx="11" fill="#EAF2FF"/>
  </g>
  <!-- reflet et graduations -->
  <path d="M206 250 L160 336" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <g stroke="#EAF2FF" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M282 262 L298 262"/>
    <path d="M302 298 L318 298"/>
    <path d="M322 334 L338 334"/>
  </g>
</svg>
