<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maxence</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <!-- Icône "M." du site (le ?v=2 force les navigateurs et l'iPhone à oublier l'ancienne icône) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Maxence" />
    <meta name="apple-mobile-web-app-title" content="Maxence" />
    <meta name="theme-color" content="#f4f1ea" />
  </head>
  <body>
    <div id="root">
      <!-- Écran de chargement affiché pendant que le site se charge
           (remplacé automatiquement dès que le site est prêt) -->
      <style>
        .ecran-depart { position: fixed; inset: 0; background: #f4f1ea; color: #022c22; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .ecran-depart .forme1 { position: absolute; top: -8rem; right: -6rem; width: 20rem; height: 20rem; border-radius: 9999px; background: rgba(110, 231, 183, 0.4); filter: blur(64px); }
        .ecran-depart .forme2 { position: absolute; bottom: 0; left: -8rem; width: 20rem; height: 20rem; border-radius: 9999px; background: rgba(253, 230, 138, 0.5); filter: blur(64px); }
        .ecran-depart .nom { position: relative; font-family: Fraunces, Georgia, serif; font-size: 2.25rem; font-weight: 600; letter-spacing: -0.025em; margin: 0; }
        .ecran-depart .roue { position: relative; margin-top: 1.5rem; width: 2rem; height: 2rem; border-radius: 9999px; border: 3px solid rgba(6, 78, 59, 0.15); border-top-color: #047857; animation: tourner 1s linear infinite; }
        .ecran-depart .texte { position: relative; margin-top: 1rem; font-family: Inter, system-ui, sans-serif; font-size: 0.875rem; color: rgba(6, 78, 59, 0.6); }
        @keyframes tourner { to { transform: rotate(360deg); } }
      </style>
      <div class="ecran-depart">
        <div class="forme1"></div>
        <div class="forme2"></div>
        <p class="nom">Maxence</p>
        <div class="roue"></div>
        <p class="texte">Chargement…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
