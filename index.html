<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Accueil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <!-- Icônes du site : une par espace (dossier public/icons/<espace>/).
         Le script juste en dessous choisit la bonne dès l'ouverture (/julie → J rose,
         /maxence → M vert, / → accueil) ; ensuite c'est src/components/IconeProfil.jsx
         qui la change quand on navigue. Le ?v=3 force l'iPhone à oublier les anciennes. -->
    <link id="icone-svg" rel="icon" type="image/svg+xml" href="/icons/accueil/favicon.svg?v=3" />
    <link id="icone-png" rel="icon" type="image/png" sizes="32x32" href="/icons/accueil/favicon-32.png?v=3" />
    <link id="icone-apple" rel="apple-touch-icon" sizes="180x180" href="/icons/accueil/apple-touch-icon.png?v=3" />
    <link id="icone-manifest" rel="manifest" href="/icons/accueil/site.webmanifest?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta id="nom-appli" name="application-name" content="Accueil" />
    <meta id="nom-appli-apple" name="apple-mobile-web-app-title" content="Accueil" />
    <script>
      // Espaces qui ont leur propre icône (même liste que « icone » dans src/config/profils.js)
      (function () {
        var ESPACES = { maxence: 'Maxence', julie: 'Julie', couture: 'Julie' }
        var DOSSIERS = { couture: 'julie' }
        var premier = (location.pathname.split('/')[1] || '').toLowerCase()
        // Galerie couture sur son adresse à part (couture-julie.vercel.app) → icône de Julie
        if (location.hostname === 'couture-julie.vercel.app') premier = 'couture'
        if (!ESPACES[premier]) return
        var dossier = '/icons/' + (DOSSIERS[premier] || premier) + '/'
        document.getElementById('icone-svg').href = dossier + 'favicon.svg?v=3'
        document.getElementById('icone-png').href = dossier + 'favicon-32.png?v=3'
        document.getElementById('icone-apple').href = dossier + 'apple-touch-icon.png?v=3'
        document.getElementById('icone-manifest').href = dossier + 'site.webmanifest?v=3'
        document.getElementById('nom-appli').content = ESPACES[premier]
        document.getElementById('nom-appli-apple').content = ESPACES[premier]
        document.title = ESPACES[premier]
      })()
    </script>
    <meta name="theme-color" content="#f4f1ea" />
  </head>
  <body>
    <div id="root">
      <!-- Écran de chargement affiché pendant que le site se charge
           (remplacé automatiquement dès que le site est prêt) -->
      <style>
        .ecran-depart { position: fixed; inset: 0; background: #f4f1ea; color: #022c22; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .ecran-depart .forme1 { position: absolute; top: -8rem; right: -6rem; width: 20rem; height: 20rem; border-radius: 9999px; background: rgba(110, 231, 183, 0.4); filter: blur(64px); }
        .ecran-depart .forme2 { position: absolute; bottom: 0; left: -8rem; width: 20rem; height: 20rem; border-radius: 9999px; background: rgba(253, 230, 138, 0.5); filter: blur(64px); }
        .ecran-depart .nom { position: relative; font-family: Fraunces, Georgia, serif; font-size: 2.25rem; font-weight: 600; letter-spacing: -0.025em; margin: 0; }
        .ecran-depart .roue { position: relative; margin-top: 1.5rem; width: 2rem; height: 2rem; border-radius: 9999px; border: 3px solid rgba(6, 78, 59, 0.15); border-top-color: #047857; animation: tourner 1s linear infinite; }
        .ecran-depart .texte { position: relative; margin-top: 1rem; font-family: Inter, system-ui, sans-serif; font-size: 0.875rem; color: rgba(6, 78, 59, 0.6); }
        @keyframes tourner { to { transform: rotate(360deg); } }
      </style>
      <div class="ecran-depart">
        <div class="forme1"></div>
        <div class="forme2"></div>
        <p class="nom">Maxence</p>
        <div class="roue"></div>
        <p class="texte">Chargement…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
